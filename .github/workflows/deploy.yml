name: Deploy to Hetzner

on:
  push:
    branches:
      - feat/LocalStrapi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🛠 Install Dependencies & Build (Next.js)
        run: |
          cd client
          npm install
          npm run build
          npm run export

      - name: 🔑 Setup SSH Connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy via SCP
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "rm -rf ${{ secrets.DEPLOY_PATH }}*"
          scp -r client/out/* ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}
